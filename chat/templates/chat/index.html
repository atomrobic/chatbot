<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stranger Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #323544;
            --bg-app: #282a36;
            --bg-msg-other: #353846;
            --bg-msg-self: #21232d;
            --bg-input: #1a1c24;
            --text-main: #e2e4ec;
            --text-muted: #9ba0b5;
            --accent-pink: #f93c6e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            background: var(--bg-app);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        @media (min-width: 480px) {
            .app-container {
                height: 90vh;
                max-height: 850px;
                border-radius: 24px;
                overflow: hidden;
            }
        }

        /* --- HEADER --- */
        .chat-header {
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            background: var(--bg-app);
            position: relative;
            z-index: 10;
        }

        .btn-next {
            background: none;
            border: none;
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5px;
            transition: opacity 0.2s;
        }
        
        .btn-next:hover { opacity: 0.7; }
        
        .btn-next svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .stranger-info {
            display: flex;
            align-items: center;
            gap: 15px;
            flex: 1;
        }

        .stranger-info img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
        }

        .stranger-details {
            display: flex;
            flex-direction: column;
        }

        .stranger-details h2 {
            font-size: 1.1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #fbbf24;
            border-radius: 50%;
        }
        .status-dot.connected { background-color: #10b981; }
        .status-dot.disconnected { background-color: #ef4444; }

        .stranger-details p {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* --- CHAT LOG --- */
        .chat-log {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        .chat-log::-webkit-scrollbar { width: 4px; }
        .chat-log::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }

        .message-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 85%;
            animation: fadeIn 0.3s ease-out forwards;
        }

        .message-group.other {
            align-self: flex-start;
        }

        .message-group.self {
            align-self: flex-end;
            align-items: flex-end;
        }
        
        .message-group.system {
            align-self: center;
            max-width: 100%;
            align-items: center;
        }

        .sender-name {
            font-size: 0.85rem;
            color: var(--text-main);
            margin-bottom: 2px;
            padding: 0 5px;
        }

        .message {
            padding: 14px 18px;
            border-radius: 20px;
            font-size: 0.95rem;
            line-height: 1.5;
            word-break: break-word;
        }

        .other .message {
            background-color: var(--bg-msg-other);
            color: var(--text-main);
        }

        .self .message {
            background-color: var(--bg-msg-self);
            color: var(--text-main);
        }

        .system .message {
            background-color: transparent;
            color: var(--text-muted);
            font-size: 0.8rem;
            font-style: italic;
            padding: 4px 12px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- INPUT AREA --- */
        .input-area-container {
            padding: 15px 20px 25px;
            background: var(--bg-app);
        }

        .input-wrapper {
            background: var(--bg-input);
            border-radius: 16px;
            display: flex;
            align-items: flex-end;
            padding: 10px;
            min-height: 120px;
            position: relative;
        }

        #chat-message-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            padding: 10px;
            font-size: 0.95rem;
            color: var(--text-main);
            resize: none;
            height: 100%;
            align-self: stretch;
            line-height: 1.4;
        }

        #chat-message-input::placeholder { color: var(--text-muted); }
        #chat-message-input:disabled { opacity: 0.6; cursor: not-allowed; }

        #chat-message-submit {
            background: var(--accent-pink);
            color: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, opacity 0.2s;
            flex-shrink: 0;
            margin-left: 10px;
        }

        #chat-message-submit:disabled {
            background: var(--bg-msg-other);
            cursor: not-allowed;
            opacity: 0.7;
        }

        #chat-message-submit:not(:disabled):hover {
            transform: scale(1.05);
        }
        
        #chat-message-submit:not(:disabled):active {
            transform: scale(0.95);
        }

        #chat-message-submit svg {
            width: 20px;
            height: 20px;
            fill: white;
            stroke: none;
            transform: translateX(1px);
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- HEADER -->
        <div class="chat-header">
            <!-- Used as Next / Skip button -->
            <button class="btn-next" id="btn-next" title="Skip to next person">
                <svg viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg>
            </button>
            
            <div class="stranger-info">
                <img src="https://loremflickr.com/150/150/cute,animal" alt="Stranger">
                <div class="stranger-details">
                    <h2>Stranger <div id="status-indicator" class="status-dot"></div></h2>
                    <p id="status-text">Anonymous Chat</p>
                </div>
            </div>
        </div>
        
        <!-- CHAT LOG -->
        <div class="chat-log" id="chat-log">
            <!-- Messages will appear here -->
        </div>
        
        <!-- INPUT -->
        <div class="input-area-container">
            <div class="input-wrapper">
                <textarea id="chat-message-input" placeholder="Write a message..." disabled></textarea>
                
                <button id="chat-message-submit" disabled>
                    <svg viewBox="0 0 24 24"><path d="M3 3l19 9-19 9 3-9-3-9z"/></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        let chatSocket = null;
        let isConnectedToStranger = false;
        let lastSender = null;

        const chatLog = document.getElementById('chat-log');
        const messageInput = document.getElementById('chat-message-input');
        const messageSubmit = document.getElementById('chat-message-submit');
        const btnNext = document.getElementById('btn-next');
        const statusIndicator = document.getElementById('status-indicator');
        const statusText = document.getElementById('status-text');

        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
            chatSocket = new WebSocket(protocol + window.location.host + '/ws/chat/');

            chatSocket.onmessage = function(e) {
                const data = JSON.parse(e.data);
                
                if (data.type === 'chat') {
                    appendChatMessage(data.sender, data.message);
                } else if (data.type === 'system') {
                    appendSystemMessage(data.message);
                    handleSystemAction(data.action);
                }
            };

            chatSocket.onclose = function(e) {
                console.error('Chat socket closed unexpectedly');
                appendSystemMessage('Connection lost. Please refresh.');
                setUIState('disconnected');
            };
        }

        function handleSystemAction(action) {
            if (action === 'waiting') {
                setUIState('waiting');
            } else if (action === 'connected') {
                setUIState('connected');
            } else if (action === 'disconnected') {
                setUIState('disconnected');
            }
        }

        function setUIState(state) {
            lastSender = null; // reset grouping
            if (state === 'waiting') {
                isConnectedToStranger = false;
                statusIndicator.className = 'status-dot';
                statusText.textContent = "Waiting for match...";
                messageInput.disabled = true;
                messageInput.placeholder = 'Waiting for a stranger...';
                messageSubmit.disabled = true;
            } else if (state === 'connected') {
                isConnectedToStranger = true;
                statusIndicator.className = 'status-dot connected';
                statusText.textContent = "Online";
                messageInput.disabled = false;
                messageInput.placeholder = 'Write a message...';
                messageSubmit.disabled = false;
                messageInput.focus();
            } else if (state === 'disconnected') {
                isConnectedToStranger = false;
                statusIndicator.className = 'status-dot disconnected';
                statusText.textContent = "Disconnected";
                messageInput.disabled = true;
                messageInput.placeholder = 'Stranger left the chat.';
                messageSubmit.disabled = true;
            }
        }

        function appendChatMessage(sender, message) {
            const isSelf = sender === 'You';
            
            // Check if we can append to the last message group
            if (lastSender === sender) {
                const lastGroup = chatLog.lastElementChild;
                if (lastGroup && !lastGroup.classList.contains('system')) {
                    const msgEl = document.createElement('div');
                    msgEl.className = 'message';
                    msgEl.textContent = message;
                    lastGroup.appendChild(msgEl);
                    scrollToBottom();
                    return;
                }
            }
            
            // Create a new group
            lastSender = sender;
            
            const group = document.createElement('div');
            group.className = `message-group ${isSelf ? 'self' : 'other'}`;
            
            if (!isSelf) {
                const nameEl = document.createElement('div');
                nameEl.className = 'sender-name';
                nameEl.textContent = 'Stranger';
                group.appendChild(nameEl);
            }
            
            const msgEl = document.createElement('div');
            msgEl.className = 'message';
            msgEl.textContent = message;
            
            group.appendChild(msgEl);
            chatLog.appendChild(group);
            scrollToBottom();
        }

        function appendSystemMessage(message) {
            lastSender = null;
            const group = document.createElement('div');
            group.className = 'message-group system';
            
            const msgEl = document.createElement('div');
            msgEl.className = 'message';
            msgEl.textContent = message;
            
            group.appendChild(msgEl);
            chatLog.appendChild(group);
            scrollToBottom();
        }

        function scrollToBottom() {
            chatLog.scrollTop = chatLog.scrollHeight;
        }

        // Initialize connection
        connectWebSocket();

        // Event Listeners
        messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                messageSubmit.click();
            }
        });

        messageSubmit.onclick = function(e) {
            const message = messageInput.value.trim();
            if (message && chatSocket && chatSocket.readyState === WebSocket.OPEN && isConnectedToStranger) {
                chatSocket.send(JSON.stringify({
                    'action': 'message',
                    'message': message
                }));
                messageInput.value = '';
            }
        };
        
        btnNext.onclick = function(e) {
            if (chatSocket && chatSocket.readyState === WebSocket.OPEN) {
                chatLog.innerHTML = '';
                lastSender = null;
                chatSocket.send(JSON.stringify({
                    'action': 'next'
                }));
            }
        }
    </script>
</body>
</html>
